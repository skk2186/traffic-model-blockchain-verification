server.port=8088
spring.application.name=transportation-cross-verification-service

verification.zkp.mode=${ZKP_MODE:real}
verification.zkp.allow-legacy-mock=${ZKP_ALLOW_LEGACY_MOCK:false}
verification.zkp.zokrates-executable=${ZOKRATES_EXECUTABLE:E:/桂电/区块链/多模态交通大模型/ZoKrates/target/release/zokrates.exe}
verification.zkp.key-root=${ZKP_KEY_ROOT:config/zkp}
verification.zkp.temp-root=${ZKP_TEMP_ROOT:runtime/zkp-temp}
verification.zkp.timeout-millis=${ZKP_TIMEOUT_MILLIS:30000}
verification.zkp.max-output-bytes=${ZKP_MAX_OUTPUT_BYTES:1048576}
verification.threshold-signature.mode=${THRESHOLD_SIGNATURE_MODE:real}
verification.threshold-signature.allow-legacy-mock=${THRESHOLD_SIGNATURE_ALLOW_LEGACY_MOCK:false}

wecross.mode=${WECROSS_MODE:trusted-ledger}
wecross.contract-method=${WECROSS_CONTRACT_METHOD:saveRecord}
wecross.default-targets=${WECROSS_DEFAULT_TARGETS:traffic.bcos30.VerificationStore,traffic.fabric20.VerificationStore}
wecross.router-url=${WECROSS_ROUTER_URL:http://127.0.0.1:8250}

# Verification record storage. Default keeps the previous in-memory behavior.
# Set VERIFICATION_RECORDS_STORAGE=mysql and provide the MySQL connection below to persist records.
verification.records.storage=${VERIFICATION_RECORDS_STORAGE:memory}
verification.records.mysql.url=${VERIFICATION_RECORDS_MYSQL_URL:}
verification.records.mysql.username=${VERIFICATION_RECORDS_MYSQL_USERNAME:root}
verification.records.mysql.password=${VERIFICATION_RECORDS_MYSQL_PASSWORD:}
verification.records.mysql.initialize-schema=${VERIFICATION_RECORDS_MYSQL_INITIALIZE_SCHEMA:true}
